name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Sync plugin and NeoForge versions from the official MDK
        run: |
          curl -fsSL https://raw.githubusercontent.com/neoforged/MDK/1.21.1/build.gradle -o /tmp/mdk-build.gradle
          curl -fsSL https://raw.githubusercontent.com/neoforged/MDK/1.21.1/gradle.properties -o /tmp/mdk.properties
          PLUGIN=$(grep -oP "net\.neoforged\.moddev'\s+version\s+'\K[^']+" /tmp/mdk-build.gradle || true)
          NEO=$(grep -oP '^neo_version=\K\S+' /tmp/mdk.properties || true)
          echo "moddev plugin: $PLUGIN, neoforge: $NEO"
          if [ -n "$PLUGIN" ]; then
            sed -i -E "s/(net\.neoforged\.moddev' version ')[^']+(')/\1${PLUGIN}\2/" build.gradle
          fi
          if [ -n "$NEO" ]; then
            sed -i -E "s/^neo_version=.*/neo_version=${NEO}/" gradle.properties
          fi

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: umbra-jar
          path: build/libs/*.jar

      - name: Publish release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
