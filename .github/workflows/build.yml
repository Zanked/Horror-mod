name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project archive (only if a .zip is in the repo root)
        if: ${{ hashFiles('*.zip') != '' }}
        run: |
          ZIP=$(ls ./*.zip | head -n1)
          echo "Unpacking $ZIP"
          unzip -q -o "$ZIP" -d /tmp/unpacked
          SRC=$(dirname "$(find /tmp/unpacked -name build.gradle | head -n1)")
          test -f "$SRC/build.gradle" || { echo "build.gradle not found in the zip"; exit 1; }
          cp -a "$SRC"/. .
          ls -la

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Get Gradle wrapper and current versions from the official MDK
        run: |
          MDK=https://raw.githubusercontent.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle/HEAD
          mkdir -p gradle/wrapper
          curl -fsSL $MDK/gradlew -o gradlew
          curl -fsSL $MDK/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -fsSL $MDK/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          curl -fsSL $MDK/build.gradle -o /tmp/mdk-build.gradle
          curl -fsSL $MDK/gradle.properties -o /tmp/mdk.properties
          PLUGIN=$(grep -oP "net\.neoforged\.moddev'\s+version\s+'\K[^']+" /tmp/mdk-build.gradle || true)
          NEO=$(grep -oP '^neo_version=\K\S+' /tmp/mdk.properties || true)
          echo "moddev plugin: $PLUGIN, neoforge: $NEO"
          if [ -n "$PLUGIN" ]; then
            sed -i -E "s/(net\.neoforged\.moddev' version ')[^']+(')/\1${PLUGIN}\2/" build.gradle
          fi
          if [ -n "$NEO" ]; then
            sed -i -E "s/^neo_version=.*/neo_version=${NEO}/" gradle.properties
          fi

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: umbra-jar
          path: build/libs/*.jar

      - name: Publish release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
