name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project archive (if a .zip is in the repo root)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP"
            rm -rf /tmp/unpacked
            mkdir -p /tmp/unpacked
            unzip -q -o "$ZIP" -d /tmp/unpacked
            BG=$(find /tmp/unpacked -name build.gradle | head -n1)
            if [ -z "$BG" ]; then
              echo
